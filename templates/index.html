<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hate Speech Detector</title>
<style>
    body {
        background-color: #0E1117;
        color: #FAFAFA;
        font-family: 'Segoe UI', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }

    .card {
        background-color: #1C1F26;
        padding: 2.5rem;
        border-radius: 16px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    h1 {
        text-align: center;
        color: #6C63FF;
        margin-bottom: 0.2rem;
    }

    p.subtitle {
        text-align: center;
        color: #A0A0A0;
        margin-bottom: 1.5rem;
    }

    textarea {
        width: 100%;
        height: 120px;
        border-radius: 12px;
        border: 1px solid #333;
        background-color: #0E1117;
        color: #FAFAFA;
        padding: 0.8rem;
        font-size: 1rem;
        box-sizing: border-box;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 1rem;
        background-color: #6C63FF;
        color: white;
        border: none;
        padding: 0.8rem;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    button:hover {
        background-color: #574fd6;
    }

    #result {
        margin-top: 1.5rem;
        padding: 1rem;
        border-radius: 10px;
        text-align: center;
        font-weight: 600;
        display: none;
    }

    .hate { background-color: #3d1f1f; color: #ff6b6b; }
    .offensive { background-color: #3d371f; color: #ffd166; }
    .neither { background-color: #1f3d24; color: #6bff8f; }

    .caption {
        margin-top: 1.5rem;
        text-align: center;
        color: #777;
        font-size: 0.8rem;
    }
</style>
</head>
<body>

<div class="card">
    <h1>🛡️ Hate Speech Detector</h1>
    <p class="subtitle">Type a sentence and let the model classify it</p>

    <textarea id="userInput" placeholder="Type something..."></textarea>
    <button onclick="predict()">🔍 Predict</button>

    <div id="result"></div>

    <p class="caption">⚠️ This is an automated model and can make mistakes.</p>
</div>

<script>
async function predict() {
    const text = document.getElementById('userInput').value;
    const resultBox = document.getElementById('result');

    if (text.trim() === '') {
        resultBox.style.display = 'block';
        resultBox.className = 'offensive';
        resultBox.innerText = 'Please enter some text first.';
        return;
    }

    resultBox.style.display = 'block';
    resultBox.className = '';
    resultBox.innerText = 'Analyzing...';

    const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    if (data.error) {
        resultBox.innerText = data.error;
        return;
    }

    resultBox.innerText = data.label;

    if (data.label === 'Hate Speech') {
        resultBox.className = 'hate';
    } else if (data.label === 'Offensive Language') {
        resultBox.className = 'offensive';
    } else {
        resultBox.className = 'neither';
    }
}
</script>

</body>
</html>
